<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>建宇轻纺板块 · 数字化链路全景图</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
#viewer{display:block;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#0b5fa8;font-size:16px;background:#fff}
</style>
</head>
<body>
<div id="loading">正在加载最新展示版本…</div>
<iframe id="viewer" title="建宇轻纺板块数字化链路全景图" allow="fullscreen"></iframe>
<script>
(async function(){
  const fallback='versions/20261008-1118.html';
  try{
    const response=await fetch('latest.json?t='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('manifest');
    const latest=await response.json();
    document.getElementById('viewer').src=latest.page+'?v='+encodeURIComponent(latest.version);
  }catch(e){
    document.getElementById('viewer').src=fallback+'?v=20261008-1118';
  }
  document.getElementById('viewer').addEventListener('load',function(){
    document.getElementById('loading').style.display='none';
  });
})();
</script>
</body>
</html>
