const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chip=(text,kind='tool')=>'<span class="chip '+esc(kind)+'">'+esc(text)+'</span>';
const rich=s=>String(s??'')
  // Feishu WebView interprets legacy HTML <font size> values differently from
  // desktop Chrome. Normalize them before rendering.
  .replace(/<font\s+size=["']?([1-7])["']?\s*>/gi,'<span class="legacy-font-size-$1">')
  .replace(/<\/font>/gi,'</span>');
function card(item,kind,group){const image=item.image?'<img class="module-image"'+(kind==='over'?' style="right:.45cqw;top:4.15cqh;width:2.65cqw;height:2.65cqw;max-width:2.65cqw;max-height:2.65cqw"':'')+' src="'+item.image+'" alt="模块图标" data-zoom="'+encodeURIComponent(item.image)+'">':'';return '<div class="info-card '+kind+(item.image?' has-image':'')+'" role="button" tabindex="0" data-group="'+group+'" data-id="'+esc(item.id)+'" data-status="'+esc(item.status)+'" data-tools="'+esc(item.tools.join('|'))+'" style="--accent:'+(item.color||'#1b78ca')+'">'+(item.num?'<b class="num">'+esc(item.num)+'</b>':'')+'<div class="card-copy"><div class="card-head"><h3>'+rich(item.title)+'</h3>'+chip(item.statusText,item.status)+'</div><div class="chips">'+item.tools.map(x=>chip(x)).join('')+(item.new?chip('NEW','new'):'')+'</div><ul class="summary-list">'+item.summary.map(x=>'<li><span>'+rich(x)+'</span></li>').join('')+'</ul><div class="progress"><strong>上线进度</strong><br>'+rich(item.progress||'—')+'</div></div>'+image+'</div>'}
function render(){const t=DATA.sectionTitles||{};const control=DATA.flow[0],steps=DATA.flow.slice(1);document.getElementById('stage').innerHTML='<header class="hero"><img src="'+ASTRONAUT+'" alt="KINGLAND宇航员IP"><div><h1>'+rich(DATA.title)+'</h1><p>'+rich(DATA.subtitle)+'</p></div><div class="legend">'+[['已上线','online'],['部分上线','partial'],['建设中','building'],['持续建设','ongoing'],['规划中','planned']].map(x=>chip(x[0],x[1])).join('')+'</div></header><div class="top-grid"><section class="panel entries"><div class="panel-title">'+rich(t.entries||'商机拓展 · 客户与产品管理')+'</div><div class="entry-grid">'+DATA.entries.map(x=>card(x,'entry','entries')).join('')+'</div></section><div class="right"><section class="panel process-panel"><div class="panel-title">'+rich(t.process||'订单跟进与操作流程 · 服饰订单全链路')+'</div><div class="control-bar" role="button" tabindex="0" data-group="flow" data-id="'+esc(control.id)+'" data-status="'+esc(control.status)+'" data-tools="'+esc(control.tools.join('|'))+'"><div class="control-main"><h3>'+rich(control.title)+'</h3><span>全流程贯穿 · '+esc(control.tools.join(' · '))+'</span></div>'+chip(control.statusText,control.status)+'<p>'+control.summary.map(rich).join('；')+'</p></div><div class="flow-grid">'+steps.map((x,i)=>'<div class="flow-step">'+card(x,'flow','flow')+(i<steps.length-1?'<span class="flow-arrow">➜</span>':'')+'</div>').join('')+'</div></section><section class="panel overseas"><div class="overseas-label">📌 '+rich(t.overseas||'东南亚海外成衣采购 / 生产配套节点')+' <small>仅海外业务有此流程</small></div><div class="over-grid">'+DATA.overseas.map(x=>card(x,'over','overseas')).join('')+'</div></section></div></div><section class="panel platform"><div class="plain-title">'+rich(t.platform||'系统底座与载体分布')+'<span>点击查看系统承载内容</span></div><div class="platform-grid">'+DATA.platform.map(x=>'<div>'+card(x,'platform-card','platform')+'</div>').join('')+'</div></section>';bindCards()}
function enrichControl(){const x=DATA.flow[0],el=document.querySelector('.control-bar');if(!el)return;const p=el.querySelector('p');if(p)p.innerHTML=x.summary.map(v=>'<span>• '+rich(v)+'</span>').join('　')+'<br><strong>上线进度：</strong>'+rich(x.progress||'—');const main=el.querySelector('.control-main span');if(main)main.innerHTML=x.tools.map(v=>chip(v)).join('')}
const allItems=[...DATA.entries,...DATA.flow,...DATA.overseas,...DATA.platform];let light={images:[],index:0};
function itemOf(group,id){return DATA[group].find(x=>x.id===id)}
function bindCards(){document.querySelectorAll('[data-group][data-id]').forEach(el=>{el.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){e.stopPropagation();openLight([decodeURIComponent(z.dataset.zoom)],0);return}const a=e.target.closest('a');if(a)return;openModal(itemOf(el.dataset.group,el.dataset.id))});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(itemOf(el.dataset.group,el.dataset.id))}})})}
function galleryCols(n){return n<=1?1:n<=4?2:n<=9?3:4}
function openModal(x){if(!x)return;const imgs=(x.gallery||[]).filter(Boolean);document.getElementById('overlay').innerHTML='<div class="modal"><article><button class="close" aria-label="关闭">×</button><div class="modal-title-row">'+(x.image?'<img class="detail-icon" src="'+x.image+'">':'')+'<div><h2>'+rich(x.title)+'</h2><div class="chips">'+chip(x.statusText,x.status)+x.tools.map(v=>chip(v)).join('')+'</div></div></div><div class="modal-content"><div><h4>功能内容</h4><ul>'+x.summary.map(v=>'<li>'+rich(v)+'</li>').join('')+'</ul><div class="detail-progress"><strong>上线进度</strong><br>'+rich(x.progress||'—')+'</div>'+(x.url?'<a class="go" href="'+esc(x.url)+'" target="_blank" rel="noopener">打开关联页面 ↗</a>':'')+'</div><div class="gallery" style="--cols:'+galleryCols(imgs.length)+'">'+(imgs.length?imgs.map((src,i)=>'<img src="'+src+'" data-gallery="'+i+'" alt="展示图片 '+(i+1)+'">').join(''):'<div class="gallery-empty">暂无展示图片</div>')+'</div></div></article></div>';const modal=document.querySelector('.modal');modal.querySelector('.close').onclick=()=>overlay.innerHTML='';modal.addEventListener('click',e=>{if(e.target===modal)overlay.innerHTML=''});modal.querySelectorAll('[data-gallery]').forEach(el=>el.onclick=()=>openLight(imgs,+el.dataset.gallery))}
function openLight(images,index=0){light={images,index};drawLight()}
function drawLight(){const src=light.images[light.index];document.getElementById('overlay').innerHTML='<div class="lightbox"><button class="lb-close" aria-label="关闭">×</button>'+(light.images.length>1?'<button class="lb-nav lb-prev" aria-label="上一张">‹</button><button class="lb-nav lb-next" aria-label="下一张">›</button>':'')+'<img src="'+src+'" alt="放大图片"><span class="lb-count">'+(light.index+1)+' / '+light.images.length+'</span></div>';document.querySelector('.lb-close').onclick=()=>overlay.innerHTML='';document.querySelector('.lb-prev')?.addEventListener('click',()=>move(-1));document.querySelector('.lb-next')?.addEventListener('click',()=>move(1));let start=0;const box=document.querySelector('.lightbox');box.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)move(d>0?-1:1)},{passive:true})}
function move(d){light.index=(light.index+d+light.images.length)%light.images.length;drawLight()}
document.addEventListener('keydown',e=>{if(!document.querySelector('.lightbox'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')overlay.innerHTML=''})
const tools=[...new Set(allItems.flatMap(x=>x.tools))];document.getElementById('tool').insertAdjacentHTML('beforeend',tools.map(x=>'<option>'+esc(x)+'</option>').join(''));
function filter(){const s=status.value,t=tool.value;document.querySelectorAll('[data-status]').forEach(el=>el.classList.toggle('dim',(s!=='all'&&el.dataset.status!==s)||(t!=='all'&&!el.dataset.tools.split('|').includes(t))))}status.onchange=tool.onchange=filter;reset.onclick=()=>{status.value=tool.value='all';filter()};render();
enrichControl();
const controlStyle=document.createElement('style');controlStyle.textContent='.process-panel{grid-template-rows:auto auto minmax(0,1fr)}.control-bar{min-height:7.6cqh}.control-bar h3{font-weight:900}.control-bar p{font-size:.72cqw;line-height:1.45;color:#111;font-weight:500}.control-bar p span,.control-bar p div,.control-bar p p{font-size:inherit;color:inherit;line-height:inherit}.control-bar p strong{font-size:inherit;color:inherit;font-weight:700}';document.head.appendChild(controlStyle);
const baseOpenModal=openModal;openModal=function(x){baseOpenModal(x);const section=document.querySelector('.modal-content>div');if(section&&(x.attachments||[]).length)section.insertAdjacentHTML('beforeend','<h4>附件</h4>'+(x.attachments||[]).map((url,i)=>'<a class="go" href="'+esc(new URL(url,"https://kingland-digital-chain-map.youhui.chatgpt.site").href)+'" target="_blank" rel="noopener">附件 '+(i+1)+' ↗</a>').join(' '))};

</script></body></html>
