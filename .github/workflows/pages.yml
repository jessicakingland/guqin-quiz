name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify question bank
        shell: bash
        run: |
          cat fresh/p01.txt fresh/p02.txt fresh/p03.txt fresh/p04.txt fresh/p05.txt fresh/p06.txt \
              fresh/p07-1.txt fresh/p07-2.txt fresh/p07-3.txt fresh/p07-4.txt fresh/p07-5.txt fresh/p07-6.txt \
              fresh/p08.txt fresh/p09.txt fresh/p10.txt fresh/p11.txt fresh/p12.txt \
              > /tmp/questions.b64
          echo "Base64 bytes: $(wc -c < /tmp/questions.b64)"
          test "$(wc -c < /tmp/questions.b64 | tr -d ' ')" = "71544"
          echo "321968410f4bcbefd8b07ad0495862442c131611748d1673f23580186723c583  /tmp/questions.b64" | sha256sum -c -
          base64 -d /tmp/questions.b64 | gzip -dc > questions.js
          echo "83fba4b7ccdffac9ccb285c6d801aeaa9e4ebbc5b4cd2011898b6c6245bf67d5  questions.js" | sha256sum -c -
          node --check questions.js
          COUNT=$(grep -o '"id":"' questions.js | wc -l | tr -d ' ')
          echo "Question count: $COUNT"
          test "$COUNT" = "210"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
